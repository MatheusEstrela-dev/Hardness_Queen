<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Revisao de limiares</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  .resumo-fontes { font-weight: 600; margin: 0 0 .5rem; }
  .fonte { margin-bottom: .75rem; }
  .trecho { background: #fffbe6; border-left: 4px solid #e0b400; padding: 1rem; font-size: 1.1rem; }
  .proveniencia { font-size: .8rem; color: #666; margin: .35rem 0 0; }
  .campos { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem 1rem; margin: 1rem 0; }
  .campo strong { display: block; font-size: .75rem; color: #666; text-transform: uppercase; }
  .suspeito { background: #ffe6e6; border-left: 4px solid #cc0000; padding: .5rem 1rem; margin-top: .35rem; }
  .acoes { display: flex; gap: .5rem; align-items: center; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  #fim { display: none; }
</style>
</head>
<body>
<h1>Revisao de limiares</h1>
<p id="contador"></p>

<div id="cartao">
  <div id="fontes"></div>
  <div class="suspeito" id="motivo" hidden></div>
  <div class="campos" id="campos"></div>
  <div class="acoes">
    <button onclick="decidir('aprovado')">Aprovar (A)</button>
    <button onclick="decidir('rejeitado')">Rejeitar (R)</button>
    <button onclick="corrigir()">Corrigir faixa (C)</button>
  </div>
</div>

<p id="fim">Fila vazia. Nada pendente de revisao.</p>

<script>
let fila = [];
let atual = null;
let decidindo = false;

function pedirRevisor() {
  let nome = "";
  while (!nome.trim()) {
    nome = prompt("Seu nome, para a trilha de auditoria (obrigatorio):") || "";
  }
  return nome.trim();
}
const revisor = pedirRevisor();

async function carregar() {
  const resposta = await fetch("/api/pendentes");
  const corpo = await resposta.json();
  fila = corpo.pendentes;
  mostrar();
}

function mostrar() {
  atual = fila.shift() || null;
  document.getElementById("contador").textContent =
    atual ? `${fila.length + 1} pendente(s)` : "";
  document.getElementById("cartao").hidden = !atual;
  document.getElementById("fim").style.display = atual ? "none" : "block";
  if (!atual) return;

  renderizarFontes(atual);

  // O status do grupo e "suspeito" se QUALQUER fonte for suspeita (ver
  // agrupamento.py, agrupar_por_limiar). O motivo de cada fonte suspeita
  // aparece junto do trecho dela em renderizarFontes -- este aviso aqui e
  // so o sinal de que o grupo merece atencao redobrada antes de decidir.
  const motivo = document.getElementById("motivo");
  motivo.hidden = atual.status !== "suspeito";
  motivo.textContent = atual.status === "suspeito"
    ? "Uma ou mais fontes deste grupo foram marcadas como suspeitas -- confira os trechos acima."
    : "";

  const ordem = ["faixa", "unidade", "escala", "nivel", "janela_horas",
                 "dominio", "grandeza", "entidade_nome"];
  const campos = document.getElementById("campos");
  campos.textContent = "";
  for (const campo of ordem) {
    const valor = campo === "faixa" ? formatarFaixa(atual) : (atual[campo] ?? "-");
    const div = document.createElement("div");
    div.className = "campo";
    const rotulo = document.createElement("strong");
    rotulo.textContent = campo;
    div.appendChild(rotulo);
    div.appendChild(document.createTextNode(String(valor)));
    campos.appendChild(div);
  }
}

function renderizarFontes(grupo) {
  // A evidencia vem ANTES dos campos extraidos (ver mostrar(), que chama
  // esta funcao antes de preencher #campos): na ordem inversa o revisor
  // tende a confirmar o numero que ja esta na tela, e um portao que so
  // confirma nao e portao. Com mais de uma fonte, mostrar todas as
  // citacoes e exatamente o motivo deste agrupamento existir -- um revisor
  // vendo o mesmo limiar afirmado em tres documentos e o sinal que a
  // repeticao carregava e que a fila antiga escondia.
  const container = document.getElementById("fontes");
  container.textContent = "";

  const resumo = document.createElement("p");
  resumo.className = "resumo-fontes";
  const docs = grupo.fontes.map(fonte => fonte.fonte_doc).join(", ");
  resumo.textContent = grupo.total_fontes > 1
    ? `${grupo.total_fontes} fontes corroboram este limiar: ${docs}`
    : `1 fonte: ${docs}`;
  container.appendChild(resumo);

  for (const fonte of grupo.fontes) {
    const bloco = document.createElement("div");
    bloco.className = "fonte";

    const trecho = document.createElement("div");
    trecho.className = "trecho";
    trecho.textContent = fonte.fonte_trecho;
    bloco.appendChild(trecho);

    if (fonte.status === "suspeito") {
      const motivoFonte = document.createElement("div");
      motivoFonte.className = "suspeito";
      motivoFonte.textContent = fonte.motivo_suspeita || "";
      bloco.appendChild(motivoFonte);
    }

    const proveniencia = document.createElement("div");
    proveniencia.className = "proveniencia";
    const pagina = fonte.fonte_pagina ?? "-";
    proveniencia.textContent =
      `${fonte.fonte_doc} - pagina ${pagina} - ${fonte.fonte_secao ?? "-"} - origem: ${fonte.origem} - status: ${fonte.status}`;
    bloco.appendChild(proveniencia);

    container.appendChild(bloco);
  }
}

function formatarFaixa(regra) {
  const min = regra.valor_min;
  const max = regra.valor_max;
  if (min !== null && min !== undefined && max !== null && max !== undefined) {
    return `${min} - ${max} ${regra.unidade}`;
  }
  if (min !== null && min !== undefined) {
    return `>= ${min} ${regra.unidade}`;
  }
  if (max !== null && max !== undefined) {
    return `<= ${max} ${regra.unidade}`;
  }
  return "-";
}

async function decidir(veredito, valorMinCorrigido, valorMaxCorrigido) {
  // Guarda sincrona: uma tecla segurada (repeat) ou duas teclas rapidas
  // disparam decidir() duas vezes antes do primeiro fetch responder. Sem
  // isto, duas POSTs para o mesmo regra_id e dois fila.shift() pulam uma
  // regra da revisao sem ninguem perceber.
  if (!atual || decidindo) return;
  decidindo = true;
  try {
    const resposta = await fetch("/api/decisao", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        // Uma decisao vale para o grupo inteiro: todo regra_id de toda
        // fonte que corrobora este limiar recebe o mesmo veredito, o mesmo
        // revisor e o mesmo timestamp (o servidor grava um registro por
        // regra_id em decisoes.jsonl -- ver app.py, decidir()).
        regra_ids: atual.fontes.map(fonte => fonte.regra_id),
        veredito: veredito,
        valor_min_corrigido: valorMinCorrigido ?? null,
        valor_max_corrigido: valorMaxCorrigido ?? null,
        revisor: revisor,
      }),
    });
    if (!resposta.ok) {
      const corpo = await resposta.json().catch(() => null);
      const detalhe = corpo && corpo.detail ? JSON.stringify(corpo.detail) : resposta.statusText;
      alert(`Falha ao registrar decisao (HTTP ${resposta.status}): ${detalhe}\nA fila NAO avancou -- tente novamente.`);
      return;
    }
    mostrar();
  } finally {
    decidindo = false;
  }
}

function parseExtremo(entrada) {
  const texto = entrada.trim();
  if (texto === "") return null;
  const numero = parseFloat(texto.replace(",", "."));
  return Number.isNaN(numero) ? undefined : numero;
}

function corrigir() {
  if (!atual) return;
  const entradaMin = prompt("Minimo (vazio para sem limite):", atual.valor_min ?? "");
  if (entradaMin === null) return;
  const entradaMax = prompt("Maximo (vazio para sem limite):", atual.valor_max ?? "");
  if (entradaMax === null) return;

  const min = parseExtremo(entradaMin);
  const max = parseExtremo(entradaMax);
  if (min === undefined || max === undefined) return;
  if (min === null && max === null) return;

  decidir("corrigido", min, max);
}

document.addEventListener("keydown", evento => {
  if (evento.target.tagName === "INPUT") return;
  // event.repeat: o SO repete keydown enquanto a tecla fica pressionada.
  // Um revisor guiado por teclado segura "A" naturalmente -- sem este
  // guard, cada repeticao dispara outra decisao para a mesma regra.
  if (evento.repeat) return;
  if (decidindo) return;
  const tecla = evento.key.toLowerCase();
  if (tecla === "a") decidir("aprovado");
  if (tecla === "r") decidir("rejeitado");
  if (tecla === "c") corrigir();
});

carregar();
</script>
</body>
</html>
